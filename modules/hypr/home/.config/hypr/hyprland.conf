# Module defaults. Machine-specific bits live in profile overlays:
#   ~/.config/hypr/local/*.conf  (monitors, env, autostart, input)
# Bindings will be generated from the action catalog into binds.conf.

$mod = SUPER
$terminal = kitty

# Session runs under uwsm (systemd units per app; clean env + logout).
# Launch long-running apps through `uwsm app --` so they get their own unit.
exec-once = uwsm app -- quickshell

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
}

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle,caps:escape
    numlock_by_default = true
}

source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/local/*.conf
